<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particles</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f1d2d; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script src="images.js"></script>
<script>
(() => {
  const COUNT = 200000;
  const IW = 1712, IH = 1105;

  const renderer = new THREE.WebGLRenderer({ antialias: false });
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);

  const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; });
  Promise.all([load(window.IMG_A), load(window.IMG_B)]).then(([a, b]) => start(a, b));

  // sample particle positions from an image, weighted by brightness above the background
  function sample(img) {
    const c = document.createElement('canvas');
    c.width = IW; c.height = IH;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, IW, IH);
    const d = g.getImageData(0, 0, IW, IH).data;
    let br = 0, bg = 0, bb = 0;
    for (const [cx, cy] of [[4, 4], [IW - 5, 4], [4, IH - 5], [IW - 5, IH - 5]]) {
      const k = (cy * IW + cx) * 4; br += d[k]; bg += d[k + 1]; bb += d[k + 2];
    }
    br /= 4; bg /= 4; bb /= 4;
    const bgLum = (br + bg + bb) / 765;
    const n = IW * IH;
    const cdf = new Float32Array(n), val = new Float32Array(n);
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const lum = (d[i*4] + d[i*4+1] + d[i*4+2]) / 765;
      const v = Math.min(1, Math.max(0, (lum - bgLum - 0.03) / 0.5));
      val[i] = v;
      sum += v + 0.0003;
      cdf[i] = sum;
    }
    const xs = new Float32Array(COUNT), ys = new Float32Array(COUNT), al = new Float32Array(COUNT);
    for (let p = 0; p < COUNT; p++) {
      const r = Math.random() * sum;
      let lo = 0, hi = n - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] < r) lo = m + 1; else hi = m; }
      xs[p] = (lo % IW) + Math.random();
      ys[p] = ((lo / IW) | 0) + Math.random();
      al[p] = 0.3 + 0.7 * val[lo];
    }
    return { xs, ys, al, bg: (Math.round(br) << 16) | (Math.round(bg) << 8) | Math.round(bb) };
  }

  function start(imgA, imgB) {
    const shapes = [sample(imgA), sample(imgB)];
    const bgHex = shapes[0].bg;
    document.body.style.background = '#' + bgHex.toString(16).padStart(6, '0');
    renderer.setClearColor(bgHex);

    const pos = new Float32Array(COUNT * 3);
    const alpha = new Float32Array(COUNT);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthTest: false, depthWrite: false,
      uniforms: { uSize: { value: 1.6 } },
      vertexShader: `
        attribute float aAlpha; varying float vA; uniform float uSize;
        void main(){ vA = aAlpha; gl_PointSize = uSize; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying float vA;
        void main(){ vec2 c = gl_PointCoord - 0.5; float d = length(c);
          if (d > 0.5) discard; gl_FragColor = vec4(0.96,0.96,1.0, vA * smoothstep(0.5,0.1,d)); }`
    });
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    scene.add(points);

    const vel = new Float32Array(COUNT * 2);
    const drift = new Float32Array(COUNT * 2);
    const tx = new Float32Array(COUNT), ty = new Float32Array(COUNT);
    const stiff = new Float32Array(COUNT), release = new Float32Array(COUNT);
    for (let i = 0; i < COUNT; i++) stiff[i] = 0.02 + Math.random() * 0.04;
    let W = 1, H = 1, S = 1, cur = 0, lastSwitch = -10, now = 0;
    const mouse = { x: 0, y: 0, active: false };

    function setTargets() {
      const sh = shapes[cur];
      for (let i = 0; i < COUNT; i++) {
        tx[i] = (sh.xs[i] - IW / 2) * S;
        ty[i] = -(sh.ys[i] - IH / 2) * S;
      }
    }

    function resize() {
      const oldS = S;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H);
      camera.left = -W / 2; camera.right = W / 2; camera.top = H / 2; camera.bottom = -H / 2;
      camera.updateProjectionMatrix();
      S = Math.min(W / IW, H / IH);
      mat.uniforms.uSize.value = Math.max(1.3, 1.4 * dpr * Math.min(1.4, S * 1.4));
      if (oldS !== S) { const k = S / oldS; for (let i = 0; i < COUNT; i++) { pos[i*3] *= k; pos[i*3+1] *= k; } }
      setTargets();
    }
    resize();
    for (let i = 0; i < COUNT; i++) {
      const a = Math.random() * 6.283, r = Math.random() * Math.max(W, H) * 0.7;
      pos[i*3] = tx[i] + Math.cos(a) * r; pos[i*3+1] = ty[i] + Math.sin(a) * r;
      release[i] = Math.random() * 0.8;
    }

    // clockwise swirl-scatter, then particles spiral into the other image
    function morph() {
      cur = 1 - cur;
      lastSwitch = now;
      setTargets();
      const sc = Math.max(0.6, S * 1.5);
      for (let i = 0; i < COUNT; i++) {
        const x = pos[i*3] / W, y = pos[i*3+1] / H;
        const a = -(Math.sin(x * 7.0 + y * 3.0) + Math.cos(y * 8.0 - x * 2.5)) * 1.6 + (Math.random() - 0.5) * 1.2;
        const far = Math.random() < 0.15 ? 1.8 : 0.8;
        const sp = (0.8 + Math.random() * 1.8) * sc * far;
        drift[i*2] = Math.cos(a) * sp; drift[i*2+1] = Math.sin(a) * sp;
        vel[i*2] += drift[i*2] * 7; vel[i*2+1] += drift[i*2+1] * 7;
        release[i] = now + 0.3 + (tx[i] / W + 0.5) * 0.3 + Math.random() * 0.5;
        stiff[i] = 0.02 + Math.random() * 0.03;
      }
    }

    // ---- circular-gesture detection ----
    const trail = [];                       // recent pointer samples {t,x,y}
    function checkCircle() {
      const T = performance.now();
      while (trail.length && T - trail[0].t > 3000) trail.shift();
      if (trail.length < 12 || now - lastSwitch < 2.5) return;
      let cx = 0, cy = 0;
      for (const p of trail) { cx += p.x; cy += p.y; }
      cx /= trail.length; cy /= trail.length;
      let total = 0, rSum = 0, prev = null;
      for (const p of trail) {
        const dx = p.x - cx, dy = p.y - cy;
        rSum += Math.hypot(dx, dy);
        const a = Math.atan2(dy, dx);
        if (prev !== null) {
          let da = a - prev;
          if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI;
          total += da;
        }
        prev = a;
      }
      const meanR = rSum / trail.length;
      if (Math.abs(total) > Math.PI * 3 && meanR > Math.min(W, H) * 0.2) {
        trail.length = 0;
        morph();
      }
    }

    const move = e => {
      mouse.x = e.clientX - W / 2; mouse.y = -(e.clientY - H / 2); mouse.active = true;
      trail.push({ t: performance.now(), x: e.clientX, y: e.clientY });
      checkCircle();
    };
    const leave = () => { mouse.active = false; trail.length = 0; };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerdown', move);
    window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') leave(); });
    document.addEventListener('mouseleave', leave);
    window.addEventListener('blur', leave);
    window.addEventListener('resize', resize);

    let last = performance.now();
    function frame(t) {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      now += dt;
      const f = dt * 60;
      const R = Math.min(W, H) * 0.14, R2 = R * R;
      const scl = Math.max(0.5, Math.min(W, H) / 800);
      const push = 5 * scl, soft = 0.8 * scl;
      const RB = Math.min(W, H) * 0.45, RB2 = RB * RB;
      const damp = Math.pow(0.9, f), mom = Math.pow(0.7, f);
      const mx = mouse.x, my = mouse.y, useMouse = mouse.active;
      const al = shapes[cur].al;

      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3, i2 = i * 2;
        let x = pos[i3], y = pos[i3 + 1], vx = vel[i2], vy = vel[i2 + 1];
        const scattering = now > lastSwitch && now < release[i] && lastSwitch >= 0;

        if (now >= release[i]) {
          const e = Math.min(1, stiff[i] * (now - lastSwitch < 3 ? 2.2 : 1) * f);
          const ddx = tx[i] - x, ddy = ty[i] - y;
          vx *= mom; vy *= mom;
          if (now - lastSwitch < 3) { x += (ddx - ddy * 0.6) * e; y += (ddy + ddx * 0.6) * e; }
          else { x += ddx * e; y += ddy * e; }
        } else if (scattering) {
          vx += (drift[i2] * 0.12 + (Math.random() - 0.5) * 0.7 + y * 0.0016) * f;
          vy += (drift[i2+1] * 0.12 + (Math.random() - 0.5) * 0.7 - x * 0.0016) * f;
        }
        if (useMouse) {
          const dx = x - mx, dy = y - my, d2 = dx * dx + dy * dy;
          if (d2 < RB2) {
            const d = Math.sqrt(d2) + 0.001;
            // wide, gentle halo: a soft outward nudge with a little swirl
            const qb = 1 - d / RB, fb = qb * qb * soft * f;
            vx += (dx / d) * fb + (dy / d) * fb * 0.6;
            vy += (dy / d) * fb - (dx / d) * fb * 0.6;
            if (d2 < R2) {
              // tight core: the original strong scatter (this sets the hole size)
              const q = 1 - d / R, fo = q * q * push * f;
              vx += (dx / d) * fo + (dy / d) * fo * 0.5 + (Math.random() - 0.5) * fo * 0.9;
              vy += (dy / d) * fo - (dx / d) * fo * 0.5 + (Math.random() - 0.5) * fo * 0.9;
            }
          }
        }
        vx *= damp; vy *= damp;
        pos[i3] = x + vx * f; pos[i3 + 1] = y + vy * f;
        vel[i2] = vx; vel[i2 + 1] = vy;
        const goal = scattering ? al[i] * 0.85 : al[i];
        alpha[i] += (goal - alpha[i]) * Math.min(1, 0.08 * f);
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.aAlpha.needsUpdate = true;
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
